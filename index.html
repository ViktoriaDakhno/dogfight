<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dogfight</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0f1a; overflow: hidden; }
    canvas { display: block; }

    #ui {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
      font: 15px/1.4 system-ui, sans-serif; color: #e8f1ff;
    }
    .panel {
      pointer-events: auto;
      width: min(520px, calc(100vw - 32px));
      max-height: calc(100vh - 32px); overflow: auto;
      box-sizing: border-box; padding: 20px 24px;
      background: #121a2e; border: 1px solid #4a6fa5; border-radius: 10px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }
    .panel.docked { align-self: flex-end; margin-bottom: 44px; }
    .panel.error { border-color: #ff6b6b; }
    .panel.warning { border-color: #ffd166; }
    .panel h1, .panel h2 { margin: 0 0 12px; font-size: 20px; }
    .panel p { margin: 6px 0; color: #c9d4ea; }

    .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
    .field span, .label { color: #9aa7bd; font-size: 13px; }
    input {
      font: inherit; color: inherit; background: #0b0f1a;
      border: 1px solid #2f3f63; border-radius: 6px; padding: 8px 10px;
    }

    .rooms { display: grid; gap: 6px; margin: 6px 0 10px; }
    .room {
      display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; text-align: left;
      font: inherit; color: inherit; background: #0b0f1a; cursor: pointer;
      border: 1px solid #2f3f63; border-radius: 8px; padding: 8px 12px;
    }
    .room small { grid-column: 1 / -1; color: #9aa7bd; }
    .room.selected { border-color: #5ec8ff; background: #14243f; }
    .room:disabled { opacity: 0.45; cursor: not-allowed; }

    .status { font-size: 13px; color: #9aa7bd; min-height: 1.4em; }
    .status.error { color: #ff6b6b; }
    .warnings { margin-top: 10px; font-size: 13px; color: #ffd166; }

    .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
    button {
      font: inherit; color: #e8f1ff; background: #1e2a45; cursor: pointer;
      border: 1px solid #2f3f63; border-radius: 6px; padding: 8px 14px;
    }
    button.primary { background: #2563eb; border-color: #2563eb; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
